[project]
name = "gridworld-q-learning"
version = "1.0.0"
description = "Tabular Q-learning on a custom grid world with obstacles and a black hole"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
gym = ["gymnasium>=0.29"]
render = ["pygame>=2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
